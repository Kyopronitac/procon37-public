[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
procon37-common = { path = "../../common" }
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "fs", "signal"] }
axum = "=0.8.9"
reqwest = { version = "=0.12.28", default-features = false }
form_urlencoded = "=1.2.2"
