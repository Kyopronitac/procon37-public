[package]
name = "procon37-common"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
libc = "=0.2.189"
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "net", "sync", "time", "signal"] }
tempfile = "=3.27.0"
tokio-util = { version = "=0.7.19", features = ["io"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
