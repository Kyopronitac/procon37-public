<h1 id="%E5%95%8F%E9%A1%8C%E6%A6%82%E8%A6%81">問題概要</h1>
<p>六角形のマップ上にある車を動かし、各地の<strong>うどんスポット</strong>を巡る。<br />
スポットを効率よく巡り、<strong>たくさんうどんを集めた人</strong>が勝利！<img class="emoji" draggable="false" alt="🏆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c6.svg" data-marp-twemoji=""/>️</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針" data-footer="2026/09/23" data-theme="qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le" lang="C" data-marpit-pagination="5" style="--paginate:true;--header:第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針;--footer:2026/09/23;--theme:qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le;" data-marpit-pagination-total="40">
<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E5%95%8F%E9%A1%8C%E6%A6%82%E8%A6%81-1">問題概要</h1>
<p>六角形の<strong>セル</strong>には平地、山地、池、道路の 4 種類の<strong>地形タイプ</strong>が割り当てられており、平地セルのいずれかに<strong>スポット</strong>が設置されている。プレイヤーはセル上の<strong>巡回車</strong>、<strong>補給車</strong>の 2 種類の車を操作できる。</p>
<div class="columns2">
<div>
<p><img src="fig/board-map.svg" alt="center board-map" style="width:500px;" /></p>
</div>
<div class="table">
<table>

<tr>
<th style="text-align:center">図</th>

</tr>
<tr>

</tr>
<tr>

<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E5%95%8F%E9%A1%8C%E6%A6%82%E8%A6%81-2">問題概要</h1>
<h2 id="%E8%BB%8A%E3%81%AE%E5%BD%B9%E5%89%B2">車の役割</h2>
<p>プレイヤーは各車を巡回車、補給車のどちらかにするかを試合前に決めることができる。</p>
<div class="columns2">
<div>
<p><img src="fig/board-map.svg" alt="center board-map" style="width:500px;" /></p>
</div>
<div>
<div class="table">
<table>
<thead>
<tr>
<th style="text-align:center">図</th>
<th style="text-align:center">車種</th>
<th style="text-align:center">役割</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><img src="fig/ui-collector.svg" alt="ui-collector" style="width:36px;" /></td>
<td style="text-align:center">巡回車</td>
<td style="text-align:center">スポットと同じセルでうどんを獲得</td>
</tr>
<tr>
<td style="text-align:center"><img src="fig/ui-supply.svg" alt="ui-supply" style="width:36px;" /></td>
<td style="text-align:center">補給車</td>
<td style="text-align:center">巡回車と同じセルで燃料を補給</td>
</tr>
</tbody>
</table>
</div>
<ul>
<li>移動時の消費燃料は、巡回車では地形に応じて決まり、<strong>補給車の消費燃料はない</strong></li>
<li>うどんを獲得できるのは<strong>巡回車</strong>のみ</li>
<li>各巡回車が同じスポットから得るのは<strong> 1 日 1 玉</strong></li>
</ul>
</div>
</div>
<footer>2026/09/23</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針" data-footer="2026/09/23" data-theme="qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le" lang="C" data-marpit-pagination="7" style="--paginate:true;--header:第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針;--footer:2026/09/23;--theme:qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le;" data-marpit-pagination-total="40">

<h1 id="%E5%95%8F%E9%A1%8C%E6%A6%82%E8%A6%81-3">問題概要</h1>

<p>車の所要時間 (ステップ数) と巡回車の消費燃料は、移動元セルの地形タイプに依存する。</p>
<div class="columns2">

<td style="text-align:center">1</td>

<td style="text-align:center">3</td>
<td style="text-align:center">2</td>
</tr>
<tr>
<td style="text-align:center"><img src="fig/terrain-pond.svg" alt="terrain-pond" style="width:36px;" /></td>

<td style="text-align:center">—</td>
<td style="text-align:center">—</td>
</tr>
<tr>
<td style="text-align:center"><img src="fig/terrain-road.svg" alt="terrain-road" style="width:36px;" /></td>
<td style="text-align:center">道路 (順調・混雑・渋滞)</td>
<td style="text-align:center">1, 2, 4</td>
<td style="text-align:center">2</td>
</tr>

</table>
</div>
<ul>
<li>地形タイプが池のセルには進入できない</li>
<li>道路状態は日ごとに更新される</li>
</ul>
</div>
</div>
<footer>2026/09/23</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針" data-footer="2026/09/23" data-theme="qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le" lang="C" data-marpit-pagination="8" style="--paginate:true;--header:第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針;--footer:2026/09/23;--theme:qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le;" data-marpit-pagination-total="40">
<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>

<p>1 試合は 4 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0.301ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="0.529ex" role="img" focusable="false" viewBox="0 -367 778 234"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="223C" d="M55 166Q55 241 101 304T222 367Q260 367 296 349T362 304T421 252T484 208T554 189Q616 189 655 236T694 338Q694 350 698 358T708 367Q722 367 722 334Q722 260 677 197T562 134H554Q517 134 481 152T414 196T355 248T292 293T223 311Q179 311 145 286Q109 257 96 218T80 156T69 133Q55 133 55 166Z"></path></g></g></g></svg></mjx-container> 10 日かけて行われる。<br />
各日では、当日の行動をまとめて提出し、翌日では車の位置と燃料を引き継ぐ。<br />
スポットの在庫は毎日補充され、道路の混雑は前日と前々日の交通量から決まる。</p>
<p><img src="fig/day-flow.svg" alt="center day-flow" /></p>

<ul>
<li>勝敗は<strong>獲得したうどんの種類数</strong>が最優先なので、できるだけ多くの系列を集めたい。</li>
<li>獲得する玉数が少なくなっても、種類数が増えるならその経路を採用する。</li>
</ul>
</div>

<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E3%83%98%E3%82%AD%E3%82%B5%E3%81%86%E3%81%A9%E3%82%93%E3%81%AE%E6%80%A7%E8%B3%AA%E3%81%8A%E3%82%88%E3%81%B3%E8%80%83%E5%AF%9F-1">「ヘキサうどん」の性質および考察</h1>
<h2 id="%E6%99%82%E9%96%93%E3%81%A8%E7%87%83%E6%96%99%E3%81%AF%E5%88%A5%E6%AC%A1%E5%85%83%E3%81%AE%E3%82%B3%E3%82%B9%E3%83%88%E3%81%A8%E3%81%97%E3%81%A6%E8%80%83%E3%81%88%E3%82%8B">時間と燃料は別次元のコストとして考える</h2>
<div class="columns2">
<div>
<p>通る経路によって所要時間と消費燃料は変化する。</p>
<table>
<thead>
<tr>
<th style="text-align:center">移動で通る地形タイプ</th>
<th style="text-align:center">時間</th>
<th style="text-align:center">消費燃料</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center">平地を通る</td>
<td style="text-align:center">6</td>
<td style="text-align:center"><strong>3</strong></td>
</tr>
<tr>
<td style="text-align:center">順調な道路を通る</td>
<td style="text-align:center"><strong>4</strong></td>
<td style="text-align:center">5</td>
</tr>
<tr>
<td style="text-align:center">山地を通る</td>
<td style="text-align:center">8</td>
<td style="text-align:center">5</td>
</tr>
</tbody>
</table>
<ul>
<li>道路の交通量により、同じ経路でも日によって所要時間は変化する。</li>
<li>巡回車は<strong>所要時間と消費燃料の両方</strong>を考慮し、補給車は<strong>所要時間のみ</strong>を考慮する。
<ul>
<li>巡回車の場合は<strong>所要時間だけ</strong>、<strong>消費燃料だけ</strong>が良くてもダメ<img class="emoji" draggable="false" alt="🙅‍♂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f645-200d-2642-fe0f.svg" data-marp-twemoji=""/></li>
</ul>
</li>
</ul>
</div>
<div>
<p><img src="fig/terrain-cost-comparison.svg" alt="center terrain-cost" style="width:540px;" /></p>
</div>
</div>
<footer>2026/09/23</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針" data-footer="2026/09/23" data-theme="qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le" lang="C" data-marpit-pagination="13" style="--paginate:true;--header:第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針;--footer:2026/09/23;--theme:qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le;" data-marpit-pagination-total="40">
<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E3%83%98%E3%82%AD%E3%82%B5%E3%81%86%E3%81%A9%E3%82%93%E3%81%AE%E6%80%A7%E8%B3%AA%E3%81%8A%E3%82%88%E3%81%B3%E8%80%83%E5%AF%9F-2">「ヘキサうどん」の性質および考察</h1>
<h2 id="%E5%BD%93%E6%97%A5%E3%81%AE%E8%A1%8C%E5%8B%95%E3%81%8C%E7%BF%8C%E6%97%A5%E4%BB%A5%E9%99%8D%E3%81%AB%E5%BD%B1%E9%9F%BF%E3%82%92%E5%8F%8A%E3%81%BC%E3%81%99">当日の行動が、翌日以降に影響を及ぼす</h2>
<p>最終日を除いて、当日の行動によって翌日以降にも影響を及ぼすパラメータが存在する。</p>
<ul>
<li>巡回車の残り燃料</li>
<li>巡回車と各スポットの位置関係</li>
<li>巡回車と補給車の位置関係</li>
<li>道路セルへの滞在ステップ数</li>
<li>試合全体で獲得済みの系列</li>
</ul>
<p>これらを考慮することで、翌日以降の計画に改善が生まれる。<br />
<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> 当日の結果が最善になるような行動計画を考えるだけでは<img class="emoji" draggable="false" alt="🆖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f196.svg" data-marp-twemoji=""/></p>
<footer>2026/09/23</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針" data-footer="2026/09/23" data-class="chapter" data-theme="qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le" lang="C" class="chapter" data-marpit-pagination="14" style="--paginate:true;--header:第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針;--footer:2026/09/23;--class:chapter;--theme:qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le;" data-marpit-pagination-total="40">
<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>

<h1 id="3-%E7%84%BC%E3%81%8D%E3%81%AA%E3%81%BE%E3%81%97%E6%B3%95%E3%81%A8%E3%81%AF-1">3. 焼きなまし法とは</h1>
<h2 id="%E5%B1%B1%E7%99%BB%E3%82%8A%E6%B3%95%E3%81%8B%E3%82%89%E8%80%83%E3%81%88%E3%82%8B%E8%A8%88%E7%94%BB%E3%81%AE%E6%94%B9%E5%96%84%E6%96%B9%E6%B3%95">山登り法から考える、計画の改善方法</h2>
<footer>2026/09/23</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針" data-footer="2026/09/23" data-theme="qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le" lang="C" data-marpit-pagination="15" style="--paginate:true;--header:第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針;--footer:2026/09/23;--theme:qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le;" data-marpit-pagination-total="40">
<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E7%84%BC%E3%81%8D%E3%81%AA%E3%81%BE%E3%81%97%E6%B3%95%E3%81%A8%E3%81%AF">焼きなまし法とは</h1>
<h2 id="%E5%B1%B1%E7%99%BB%E3%82%8A%E6%B3%95%E5%B0%91%E3%81%97%E5%A4%89%E3%81%88%E3%81%A6%E8%89%AF%E3%81%91%E3%82%8C%E3%81%B0%E6%8E%A1%E7%94%A8%E3%82%92%E7%B9%B0%E3%82%8A%E8%BF%94%E3%81%99">山登り法：少し変えて良ければ採用を繰り返す</h2>
<p>現在の計画を少しだけ変更したものを<strong>近傍</strong>と呼ぶ。<br />
かんたんな例として、スポットの訪問順の計画 <code>A</code> → <code>B</code> → <code>C</code> の <code>B</code> と <code>C</code> を交換した <code>A</code> → <code>C</code> → <code>B</code> が近傍。<br />
改善する近傍を採用し、採用した近傍で<strong>現在の計画を更新する</strong>。</p>
<p><img src="fig/hill-step.svg" alt="center hill-step" /></p>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.179ex" height="1.595ex" role="img" focusable="false" viewBox="0 -694 521 705"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D458" d="M121 647Q121 657 125 670T137 683Q138 683 209 688T282 694Q294 694 294 686Q294 679 244 477Q194 279 194 272Q213 282 223 291Q247 309 292 354T362 415Q402 442 438 442Q468 442 485 423T503 369Q503 344 496 327T477 302T456 291T438 288Q418 288 406 299T394 328Q394 353 410 369T442 390L458 393Q446 405 434 405H430Q398 402 367 380T294 316T228 255Q230 254 243 252T267 246T293 238T320 224T342 206T359 180T365 147Q365 130 360 106T354 66Q354 26 381 26Q429 26 459 145Q461 153 479 153H483Q499 153 499 144Q499 139 496 130Q455 -11 378 -11Q333 -11 305 15T277 90Q277 108 280 121T283 145Q283 167 269 183T234 206T200 217T182 220H180Q168 178 159 139T145 81T136 44T129 20T122 7T111 -2Q98 -11 83 -11Q66 -11 57 -1T48 16Q48 26 85 176T158 471L195 616Q196 629 188 632T149 637H144Q134 637 131 637T124 640T121 647Z"></path></g></g></g></svg></mjx-container> 番目の計画 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.357ex;" xmlns="http://www.w3.org/2000/svg" width="2.315ex" height="1.357ex" role="img" focusable="false" viewBox="0 -442 1023.4 599.8"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T <header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E7%84%BC%E3%81%8D%E3%81%AA%E3%81%BE%E3%81%97%E6%B3%95%E3%81%A8%E3%81%AF-1">焼きなまし法とは</h1>
<h2 id="%E5%B1%B1%E7%99%BB%E3%82%8A%E6%B3%95%E3%81%AE%E3%83%87%E3%83%A1%E3%83%AA%E3%83%83%E3%83%88">山登り法のデメリット</h2>
<p><img src="fig/score-landscape.svg" alt="center score-landscape" /></p>
<p>どの近傍でも現在の計画より評価が下がる場所では、山登り法は先へ進めず、<strong>局所解</strong>に陥る。<br />
<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> より良い計画へ向かうには、途中で<strong>一度評価が悪化する近傍</strong>を採用する必要がある。</p>
<footer>2026/09/23</footer>

<h1 id="%E7%84%BC%E3%81%8D%E3%81%AA%E3%81%BE%E3%81%97%E6%B3%95%E3%81%A8%E3%81%AF-4">焼きなまし法とは</h1>
<h2 id="%E6%8E%A2%E7%B4%A2%E5%BA%8F%E7%9B%A4%E3%81%AF%E5%BA%83%E3%81%8F%E6%8E%A2%E3%81%97%E6%8E%A2%E7%B4%A2%E7%B5%82%E7%9B%A4%E3%81%AF%E7%B5%9E%E3%82%8B">探索序盤は広く探し、探索終盤は絞る</h2>
<p>時間が経過するごとに徐々に温度 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.593ex" height="1.532ex" role="img" focusable="false" viewBox="0 -677 704 677"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D447" d="M40 437Q21 437 21 445Q21 450 37 501T71 602L88 651Q93 669 101 677H569H659Q691 677 697 676T704 667Q704 661 687 553T668 444Q668 437 649 437Q640 437 637 437T631 442L629 445Q629 451 635 490T641 551Q641 586 628 604T573 629Q568 630 515 631Q469 631 457 630T439 622Q438 621 368 343T298 60Q298 48 386 46Q418 46 427 45T436 36Q436 31 433 22Q429 4 424 1L422 0Q419 0 415 0Q410 0 363 1T228 2Q99 2 64 0H49Q43 6 43 9T45 27Q49 40 55 46H83H94Q174 46 189 55Q190 56 191 56Q196 59 201 76T241 233Q258 301 269 344Q339 619 339 625Q339 630 310 630H279Q212 630 191 624Q146 614 121 583T67 467Q60 445 57 441T43 437H40Z"></path></g></g></g></svg></mjx-container> を下げ、<strong>悪化する近傍を採用する度合い</strong>を変える。</p>
<p><img src="fig/annealing-motion.svg" alt="center" style="width:1050px;" /></p>
<p>矢印は<strong>採用した近傍への移動</strong>を表す。</p>
<footer>2026/09/23</footer>
</section>

<h1 id="4-%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-1">4. 本問題の解法</h1>
<h2 id="%E5%95%8F%E9%A1%8C%E3%81%AE%E6%80%A7%E8%B3%AA%E3%82%92%E8%A1%8C%E5%8B%95%E8%A8%88%E7%94%BB%E3%81%AE%E4%BD%9C%E6%88%90%E3%81%A8%E7%84%BC%E3%81%8D%E3%81%AA%E3%81%BE%E3%81%97%E6%B3%95%E3%81%AB%E7%94%9F%E3%81%8B%E3%81%99">問題の性質を、行動計画の作成と焼きなまし法に生かす</h2>
<footer>2026/09/23</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針" data-footer="2026/09/23" data-theme="qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le" lang="C" data-marpit-pagination="21" style="--paginate:true;--header:第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針;--footer:2026/09/23;--theme:qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le;" data-marpit-pagination-total="40">
<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95">本問題の解法</h1>
<h2 id="%E5%85%A8%E4%BD%93%E3%81%AE%E6%B5%81%E3%82%8C">全体の流れ</h2>
<p><img src="fig/pool-overview.svg" alt="center" style="width:1050px;" /></p>
<ul>
<li>試合前に巡回車・補給車を決定する。</li>
<li>各日のはじめには、実行可能な初期計画（初期解）を作成する。</li>
<li>その計画から<strong>様々な近傍</strong>を作り、<strong>評価差と温度</strong>に応じて採用を繰り返す。
<ul>
<li>条件に応じて、日末の状態から翌日の獲得も見積もる。</li>
</ul>
</li>
</ul>
<footer>2026/09/23</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針" data-footer="2026/09/23" data-theme="qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le" lang="C" data-marpit-pagination="22" style="--paginate:true;--header:第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針;--footer:2026/09/23;--theme:qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le;" data-marpit-pagination-total="40">
<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-1">本問題の解法</h1>
<h2 id="%E8%A9%A6%E5%90%88%E5%89%8D%E8%BB%8A%E7%A8%AE%E3%81%AE%E5%89%B2%E5%BD%93">試合前：車種の割当</h2>
<p>補給車を 1 台に増やすと巡回車は 1 台減るが、他の巡回車が長く持続して走ることができる！<br />
そのため<strong>補給車 1 台</strong>にした全ての割当を試す。<br />
<strong>全て巡回車</strong>にした割当も、<strong>燃料上限の 2 倍が全日程のステップ数の合計以上</strong>なら試す。</p>
<p><img src="fig/pool-assignment.svg" alt="center" style="width:1000px;" /></p>
<p>割当ごとに<strong>ビームサーチ + 焼きなまし法で全日程を試走</strong>し、種類数・日別種類数（各日の獲得種類数の合計）・玉数の順で比較する。</p>
<p><strong>最も良い評価を得た割当</strong>を実際に採用する。</p>
<footer>2026/09/23</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針" data-footer="2026/09/23" data-class="neighborhood-detail" data-theme="qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le" lang="C" class="neighborhood-detail" data-marpit-pagination="23" style="--paginate:true;--header:第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針;--footer:2026/09/23;--class:neighborhood-detail;--theme:qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le;" data-marpit-pagination-total="40">

<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-2">本問題の解法</h1>
<h2 id="%E5%89%8D%E8%A8%88%E7%AE%97%E6%89%80%E8%A6%81%E6%99%82%E9%96%93%E3%81%A8%E6%B6%88%E8%B2%BB%E7%87%83%E6%96%99%E3%81%AE%E7%95%B0%E3%81%AA%E3%82%8B%E7%B5%8C%E8%B7%AF%E3%82%92%E7%94%A8%E6%84%8F%E3%81%99%E3%82%8B">前計算：所要時間と消費燃料の異なる経路を用意する</h2>

<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-8">本問題の解法</h1>
<h2 id="%E5%86%8D%E5%8A%A0%E7%86%B1%E3%81%A8%E5%86%8D%E3%82%B9%E3%82%BF%E3%83%BC%E3%83%88%E3%81%A7%E7%95%B0%E3%81%AA%E3%82%8B%E8%A8%88%E7%94%BB%E3%82%92%E6%8E%A2%E7%B4%A2%E3%81%97%E3%82%84%E3%81%99%E3%81%8F%E3%81%99%E3%82%8B">再加熱と再スタートで、異なる計画を探索しやすくする</h2>
<p>焼きなまし法の工夫として、<strong>温度 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.593ex" height="1.532ex" role="img" focusable="false" viewBox="0 -677 704 677"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D447" d="M40 437Q21 437 21 445Q21 450 37 501T71 602L88 651Q93 669 101 677H569H659Q691 677 697 676T704 667Q704 661 687 553T668 444Q668 437 649 437Q640 437 637 437T631 442L629 445Q629 451 635 490T641 551Q641 586 628 604T573 629Q568 630 515 631Q469 631 457 630T439 622Q438 621 368 343T298 60Q298 48 386 46Q418 46 427 45T436 36Q436 31 433 22Q429 4 424 1L422 0Q419 0 415 0Q410 0 363 1T228 2Q99 2 64 0H49Q43 6 43 9T45 27Q49 40 55 46H83H94Q174 46 189 55Q190 56 191 56Q196 59 201 76T241 233Q258 301 269 344Q339 619 339 625Q339 630 310 630H279Q212 630 191 624Q146 614 121 583T67 467Q60 445 57 441T43 437H40Z"></path></g></g></g></svg></mjx-container> を周期的に上昇させる処理（再加熱）</strong>を、全車の計画を改善する探索に使う。<br />

<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>

<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-9">本問題の解法</h1>
<h2 id="%E5%B7%A1%E5%9B%9E%E3%81%AE%E8%BF%91%E5%82%8D1-%E5%8F%B0%E3%81%AE%E8%A8%88%E7%94%BB%E3%82%92%E5%A4%89%E3%81%88%E3%82%8B-8-%E7%A8%AE%E9%A1%9E%E3%81%AE%E8%BF%91%E5%82%8D">巡回の近傍：1 台の計画を変える 8 種類の近傍</h2>
<p><strong>点</strong>は訪問・補給先などの場所と待機の指定とし、順番に並べたものを<strong>訪問列</strong>と呼ぶ。</p>
<table>
<thead>
<tr>
<th style="text-align:left">操作</th>
<th style="text-align:left">変更するもの</th>
<th style="text-align:left">狙い</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">スポットの追加</td>
<td style="text-align:left">訪問列に 1 点を挿入</td>
<td style="text-align:left">未獲得の系列や玉数を増やす</td>
</tr>
<tr>
<td style="text-align:left">スポットの削除</td>
<td style="text-align:left">訪問列から 1 点を除去</td>
<td style="text-align:left">時間・燃料の余裕を作る</td>
</tr>
<tr>
<td style="text-align:left">訪問順の変更</td>
<td style="text-align:left">同じ車の 1 点を別の順番へ挿し直す</td>
<td style="text-align:left">訪問順の遠回りを減らす</td>
</tr>
<tr>
<td style="text-align:left">連続区間の反転</td>
<td style="text-align:left">2 位置の間を逆順にする</td>
<td style="text-align:left">複数の訪問順をまとめて変える</td>
</tr>
<tr>
<td style="text-align:left">経路モードの変更</td>
<td style="text-align:left">ある区間の経路を切り替える</td>
<td style="text-align:left">時間と燃料の配分を変える</td>
</tr>
<tr>
<td style="text-align:left">訪問先の置換</td>
<td style="text-align:left">1 点を別のスポットへ変更</td>
<td style="text-align:left">系列・在庫の重複を減らす</td>
</tr>
<tr>
<td style="text-align:left">2 点の交換</td>
<td style="text-align:left">同じ車の 2 点を入れ替える</td>
<td style="text-align:left">訪問集合を保ち、訪問順を変える</td>
</tr>
<tr>
<td style="text-align:left">待機終了の変更</td>
<td style="text-align:left">待機を終えるステップを変える</td>
<td style="text-align:left">補給との時刻合わせを調整する</td>
</tr>
</tbody>
</table>
<p>訪問先だけでなく、<strong>前後の経路・通過スポット・時間・燃料</strong>も評価し直す。</p>
<footer>2026/09/23</footer>
</section>

<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-10">本問題の解法</h1>
<h2 id="%E8%BB%8A%E9%96%93%E3%81%AE%E8%BF%91%E5%82%8D%E5%B7%A1%E5%9B%9E%E8%BB%8A%E3%81%AE%E5%88%86%E6%8B%85%E3%82%92%E5%A4%89%E3%81%88%E3%82%8B-6-%E7%A8%AE%E9%A1%9E%E3%81%AE%E8%BF%91%E5%82%8D">車間の近傍：巡回車の分担を変える 6 種類の近傍</h2>
<table>
<thead>
<tr>
<th style="text-align:left">操作</th>
<th style="text-align:left">変更するもの</th>
<th style="text-align:left">狙い</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">1 点ずつ交換</td>
<td style="text-align:left">2 台から 1 点ずつ選んで交換</td>
<td style="text-align:left">近い車へ訪問を割り当て直す</td>
</tr>
<tr>
<td style="text-align:left">1 点を別車へ移動</td>
<td style="text-align:left">片方の 1 点を他方へ挿入</td>
<td style="text-align:left">訪問負担を別の車へ渡す</td>
</tr>
<tr>
<td style="text-align:left">後半の交換</td>
<td style="text-align:left">切れ目より後ろを丸ごと交換</td>
<td style="text-align:left">訪問領域と日末の位置を変える</td>
</tr>
<tr>
<td style="text-align:left">連続区間の移動</td>
<td style="text-align:left">1 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0.301ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="0.529ex" role="img" focusable="false" viewBox="0 -367 778 234"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="223C" d="M55 166Q55 241 101 304T222 367Q260 367 296 349T362 304T421 252T484 208T554 189Q616 189 655 236T694 338Q694 350 698 358T708 367Q722 367 722 334Q722 260 677 197T562 134H554Q517 134 481 152T414 196T355 248T292 293T223 311Q179 311 145 286Q109 257 96 218T80 156T69 133Q55 133 55 166Z"></path></g></g></g></svg></mjx-container> 4 点を他方へ挿入</td>
<td style="text-align:left">分担を区間単位で変える</td>
</tr>
<tr>
<td style="text-align:left">訪問列全体の交換</td>
<td style="text-align:left">2 台の全訪問列を交換</td>
<td style="text-align:left">出発位置・燃料に合う担当を試す</td>
</tr>
<tr>
<td style="text-align:left">連続区間の交換</td>
<td style="text-align:left">各車の 1 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0.301ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="0.529ex" role="img" focusable="false" viewBox="0 -367 778 234"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="223C" d="M55 166Q55 241 101 304T222 367Q260 367 296 349T362 304T421 252T484 208T554 189Q616 189 655 236T694 338Q694 350 698 358T708 367Q722 367 722 334Q722 260 677 197T562 134H554Q517 134 481 152T414 196T355 248T292 293T223 311Q179 311 145 286Q109 257 96 218T80 156T69 133Q55 133 55 166Z"></path></g></g></g></svg></mjx-container> 3 点を交換</td>
<td style="text-align:left">両車の負担をまとめて調整する</td>
</tr>
</tbody>
</table>
<p>通常の全車改善では、下 3 つの近傍は<strong>5 台以下</strong>の場合で使用する。<br />
車の現在地・開始燃料は交換せず、変更した両車の計画を評価し直す。</p>
<footer>2026/09/23</footer>
</section>

<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>

<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-11">本問題の解法</h1>
<h2 id="%E8%A3%9C%E7%B5%A6%E3%81%AE%E8%BF%91%E5%82%8D%E5%A0%B4%E6%89%80%E3%83%BB%E6%99%82%E5%88%BB%E3%83%BB%E5%90%88%E6%B5%81%E3%82%92%E5%A4%89%E3%81%88%E3%82%8B-9-%E7%A8%AE%E9%A1%9E%E3%81%AE%E8%BF%91%E5%82%8D">補給の近傍：場所・時刻・合流を変える 9 種類の近傍</h2>
<p>補給車の停車先と待機の指定を<strong>停車点</strong>、順番に並べたものを<strong>停車列</strong>、残り燃料が少ない巡回車を<strong>低燃料車</strong>と呼ぶ。</p>
<table>
<thead>
<tr>
<th style="text-align:left">操作</th>
<th style="text-align:left">変更するもの</th>
<th style="text-align:left">狙い</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">停車先の変更</td>
<td style="text-align:left">1 つの停車セルを置換</td>
<td style="text-align:left">合流しやすい場所へ向かう</td>
</tr>
<tr>
<td style="text-align:left">停車先の追加</td>
<td style="text-align:left">停車列へ 1 点を挿入</td>
<td style="text-align:left">補給できる機会を増やす</td>
</tr>
<tr>
<td style="text-align:left">停車先の削除</td>
<td style="text-align:left">停車列から 1 点を除去</td>
<td style="text-align:left">寄り道や待機を減らす</td>
</tr>
<tr>
<td style="text-align:left">待機の変更</td>
<td style="text-align:left">待機時間・終了ステップを調整</td>
<td style="text-align:left">滞在と次の合流を両立する</td>
</tr>
<tr>
<td style="text-align:left">停車順の交換</td>
<td style="text-align:left">2 つの停車点を交換</td>
<td style="text-align:left">補給する順番を変える</td>
</tr>
<tr>
<td style="text-align:left">巡回車の終点へ変更</td>
<td style="text-align:left">停車先を巡回車の終点へ移す</td>
<td style="text-align:left">日末に燃料を残す機会を作る</td>
</tr>
<tr>
<td style="text-align:left">合流を同時に作成</td>
<td style="text-align:left">両車の合流先と待機を合わせる</td>
<td style="text-align:left">同じセル・ステップで補給する</td>
</tr>
<tr>
<td style="text-align:left">低燃料車の現在地へ変更</td>
<td style="text-align:left">停車先と待機を設定</td>
<td style="text-align:left">燃料が少ない車の近くへ向かう</td>
</tr>
<tr>
<td style="text-align:left">最初の停車先だけにする</td>
<td style="text-align:left">停車列を 1 点へ縮め、長く待つ</td>
<td style="text-align:left">1 拠点で待つ計画へ組み替える</td>
</tr>
</tbody>
</table>
<p>補給車を変えたら、<strong>全巡回車の補給・燃料を再評価</strong>する。</p>
<footer>2026/09/23</footer>
</section>

<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-12">本問題の解法</h1>
<h2 id="%E5%A4%A7%E8%A6%8F%E6%A8%A1%E8%BF%91%E5%82%8D%E6%8E%A2%E7%B4%A2lns%E3%81%A7%E8%A8%AA%E5%95%8F%E3%81%AE%E4%B8%80%E9%83%A8%E3%82%92%E5%86%8D%E6%A7%8B%E7%AF%89%E3%81%99%E3%82%8B">大規模近傍探索（LNS）で、訪問の一部を再構築する</h2>
<p>小さな交換だけで改善しにくい計画を、<strong>部分破壊と再構築</strong>で大規模に変化させた近傍で改善させる。</p>
<p><img src="fig/pool-lns.svg" alt="center" style="width:1000px;height:250px;" /></p>
<ul>
<li>最大 3 台の巡回車を選び、各車で訪問列の約 1/3、最大 7 回の部分破壊を試す。待機指定のある点は残す。</li>
<li>増える獲得と迂回時間で挿入先を選ぶ。部分破壊したスポット以外も候補にし、最大 28 回追加する。</li>
</ul>
<footer>2026/09/23</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針" data-footer="2026/09/23" data-theme="qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le" lang="C" data-marpit-pagination="34" style="--paginate:true;--header:第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針;--footer:2026/09/23;--theme:qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le;" data-marpit-pagination-total="40">
<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-13">本問題の解法</h1>
<h2 id="%E6%97%A5%E3%82%92%E3%81%BE%E3%81%9F%E3%81%90%E8%BF%91%E5%82%8D%E5%BD%93%E6%97%A5%E3%81%A8%E7%BF%8C%E6%97%A5%E3%82%92%E5%A4%89%E3%81%88%E3%82%8B-3-%E7%A8%AE%E9%A1%9E%E3%81%AE%E8%BF%91%E5%82%8D">日をまたぐ近傍：当日と翌日を変える 3 種類の近傍</h2>
<p>台数・燃料・残り時間の条件を満たす場合、当日と翌日の<strong>点列（訪問列・停車列）</strong>を用意し、2 日間の巡回と補給を焼きなまし法で改善する。</p>
<table>
<thead>
<tr>
<th style="text-align:left">操作</th>
<th style="text-align:left">変更するもの</th>
<th style="text-align:left">狙い</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">当日から翌日へ移動</td>
<td style="text-align:left">当日末尾の 1 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0.301ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="0.529ex" role="img" focusable="false" viewBox="0 -367 778 234"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="223C" d="M55 166Q55 241 101 304T222 367Q260 367 296 349T362 304T421 252T484 208T554 189Q616 189 655 236T694 338Q694 350 698 358T708 367Q722 367 722 334Q722 260 677 197T562 134H554Q517 134 481 152T414 196T355 248T292 293T223 311Q179 311 145 286Q109 257 96 218T80 156T69 133Q55 133 55 166Z"></path></g></g></g></svg></mjx-container> 3 点を翌日先頭へ</td>
<td style="text-align:left">当日の時間・燃料負担を減らす</td>
</tr>
<tr>
<td style="text-align:left">翌日から当日へ移動</td>
<td style="text-align:left">翌日先頭の 1 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0.301ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="0.529ex" role="img" focusable="false" viewBox="0 -367 778 234"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="223C" d="M55 166Q55 241 101 304T222 367Q260 367 296 349T362 304T421 252T484 208T554 189Q616 189 655 236T694 338Q694 350 698 358T708 367Q722 367 722 334Q722 260 677 197T562 134H554Q517 134 481 152T414 196T355 248T292 293T223 311Q179 311 145 286Q109 257 96 218T80 156T69 133Q55 133 55 166Z"></path></g></g></g></svg></mjx-container> 3 点を当日末尾へ</td>
<td style="text-align:left">当日の余裕で先に訪問・補給する</td>
</tr>
<tr>
<td style="text-align:left">両日の計画を交換</td>
<td style="text-align:left">同じ車種の 2 台で両日の点列を交換</td>
<td style="text-align:left">2 日間の訪問領域と分担を変える</td>
</tr>
</tbody>
</table>
<ul>
<li>当日の終点・燃料が変わるたびに、翌日の開始状態も更新する。</li>
<li>翌日の道路状態は相手の行動にも左右されるため、予測を用いる。</li>
<li>2 日間の種類数・日別種類数・玉数で評価し、<strong>実行可能な最良計画</strong>を保存する。</li>
</ul>
<footer>2026/09/23</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針" data-footer="2026/09/23" data-theme="qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le" lang="C" data-marpit-pagination="35" style="--paginate:true;--header:第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針;--footer:2026/09/23;--theme:qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le;" data-marpit-pagination-total="40">
<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-14">本問題の解法</h1>
<h2 id="%E9%AB%98%E9%80%9F%E5%8C%96%E6%99%82%E9%96%93%E5%86%85%E3%81%AB%E5%A4%9A%E3%81%8F%E3%81%AE%E8%BF%91%E5%82%8D%E3%82%92%E8%A9%A6%E3%81%99">高速化：時間内に多くの近傍を試す</h2>
<p>焼きなまし法では、限られた時間に調べられる近傍の数も重要になる。</p>
<table>
<thead>
<tr>
<th style="text-align:left">高速化の工夫</th>
<th style="text-align:left">減らせる計算</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">スポット・合流セル間の経路を前計算</td>
<td style="text-align:left">同じ2地点の経路探索を何度も行わない</td>
</tr>
<tr>
<td style="text-align:left">訪問スポット・系列をビット集合で保持</td>
<td style="text-align:left">重複訪問や獲得種類数をまとめて集計する</td>
</tr>
<tr>
<td style="text-align:left">変更した巡回車を中心に評価を差分更新</td>
<td style="text-align:left">変わっていない巡回経路の展開を省く</td>
</tr>
<tr>
<td style="text-align:left">両日の経路と補給時刻表を再利用</td>
<td style="text-align:left">開始位置・燃料・訪問列・補給が同じ計算を省く</td>
</tr>
</tbody>
</table>
<p><strong>補給時刻表</strong>は、補給車が各セルにいるステップの一覧。<br />
補給車を変えたときは、その影響を受ける巡回車も再評価する。</p>
<footer>2026/09/23</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針" data-footer="2026/09/23" data-theme="qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le" lang="C" data-marpit-pagination="36" style="--paginate:true;--header:第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針;--footer:2026/09/23;--theme:qdwbpw2jdrjgwiw8tbfbvci2hcoioptmgf2twmh70le;" data-marpit-pagination-total="40">
<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-15">本問題の解法</h1>
<h2 id="%E4%B8%A6%E5%88%97%E5%87%A6%E7%90%86%E7%95%B0%E3%81%AA%E3%82%8B%E6%8E%A2%E7%B4%A2%E3%82%92%E5%90%8C%E6%99%82%E3%81%AB%E8%B5%B0%E3%82%89%E3%81%9B%E3%82%8B">並列処理：異なる探索を同時に走らせる</h2>
<p>同じ当日の状態から、<strong>乱数を変えた複数の探索</strong>を、1 台の PC で同時に行う。</p>
<p><img src="fig/pool-parallel.svg" alt="center" style="width:1000px;height:270px;" /></p>
<ul>
<li>Rust の標準ライブラリ <code>std::thread</code> で、各探索を別スレッドとして実行できる。</li>
<li>各探索は、巡回と補給を含む<strong>全車の行動計画</strong>を独立に作成・改善する。</li>
<li>実行可能な計画を <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="4.833ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2136 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43A" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q492 659 471 656T418 643T357 615T294 567T236 496T189 394T158 260Q156 242 156 221Q156 173 170 136T206 79T256 45T308 28T353 24Q407 24 452 47T514 106Q517 114 529 161T541 214Q541 222 528 224T468 227H431Q425 233 425 235T427 254Q431 267 437 273H454Q494 271 594 271Q634 271 659 271T695 272T707 272Q721 272 721 263Q721 261 719 249Q714 230 709 228Q706 227 694 227Q674 227 653 224Q646 221 643 215T629 164Q620 131 614 108Q589 6 586 3Q584 1 581 1Q571 1 553 21T530 52Q530 53 528 52T522 47Q448 -22 322 -22Q201 -22 126 55T50 252Z"></path></g><g data-mml-node="mo" transform="translate(786,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mi" transform="translate(1175,0)"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 1 </ul>

</section>

<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>

<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-16">本問題の解法</h1>
<h2 id="%E5%88%86%E6%95%A3%E5%87%A6%E7%90%86%E8%A4%87%E6%95%B0%E3%81%AE-pc-%E3%81%A7%E6%8E%A2%E7%B4%A2%E5%80%99%E8%A3%9C%E3%82%92%E5%A2%97%E3%82%84%E3%81%99">分散処理：複数の PC で探索候補を増やす</h2>
<p>並列探索を複数の PC へ広げ、<strong>状態の配布・計画の比較・提出を行う PC</strong> にて結果を集約する。</p>
<p><img src="fig/pool-distributed.svg" alt="center" style="width:1000px;height:260px;" /></p>
<ul>
<li>当日の状態・共通の車種の割当・探索期限を各 PC へ配布する。</li>
<li>各 PC は異なる乱数で探索し、全車の行動計画を返す。</li>

<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-17">本問題の解法</h1>

<header>第 37 回全国高専プロコン競技部門「ヘキサうどん」解法方針</header>
<h1 id="%E6%9C%AC%E5%95%8F%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B3%95-18">本問題の解法</h1>
<h2 id="%E3%81%BE%E3%81%A8%E3%82%81">まとめ</h2>
<p><strong>種類数を優先し、所要時間と消費燃料の制約を満たす全車の行動計画を探索する。</strong></p>
<table>
<thead>
<tr>
<th style="text-align:left">段階</th>
<th style="text-align:left">本解法で行うこと</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">車種の割当</td>
<td style="text-align:left">全日程を試走し、巡回車と補給車の分担を決める</td>
</tr>
<tr>
<td style="text-align:left">初期計画（初期解）</td>
<td style="text-align:left">経路を前計算し、補給車に合わせた巡回車の経路をビームサーチで作成する</td>
</tr>
<tr>
<td style="text-align:left">全車の共同改善</td>
<td style="text-align:left">焼きなまし法 + LNS で、巡回・車間・補給に関する多種類の近傍を試す</td>
</tr>
<tr>
<td style="text-align:left">翌日を考慮</td>
<td style="text-align:left">条件に応じて、当日に加えて、翌日の影響も評価する</td>
</tr>
<tr>
<td style="text-align:left">計画の選択</td>
<td style="text-align:left">実行可能な最良計画を保存し、当日の行動計画を提出する</td>
</tr>
</tbody>
</table>
<p>並列・分散処理への拡張では、異なる探索を同時に行い、さらに探索の幅を広げる。</p>
<footer>2026/09/23</footer>
</section>
